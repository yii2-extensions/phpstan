---
on:
  pull_request: &ignore-paths
    paths-ignore:
      - ".gitattributes"
      - ".gitignore"
      - "CHANGELOG.md"
      - "docs/**"
      - "README.md"

  push: *ignore-paths

name: static analysis

permissions:
  contents: read

jobs:
  phpstan:
    uses: yii2-framework/actions/.github/workflows/phpstan.yml@e3e99bd1c54fb350911bf446690e6146acf7660d # v2.0.6
    with:
      ignore-platform-reqs-php-version: "[8.6]"
      php-version: "[8.3, 8.4, 8.5, 8.6]"
      concurrency-group: phpstan-${{ github.workflow }}-${{ github.ref }}
  phpstan-console:
    uses: yii2-framework/actions/.github/workflows/phpstan.yml@e3e99bd1c54fb350911bf446690e6146acf7660d # v2.0.6
    with:
      ignore-platform-reqs-php-version: "[8.6]"
      php-version: "[8.3, 8.4, 8.5, 8.6]"
      configuration: "phpstan-console.neon"
      concurrency-group: |
        phpstan-console-${{ github.workflow }}-${{ github.ref }}
