---
on:
  pull_request: &ignore-paths
    paths-ignore:
      - ".gitattributes"
      - ".gitignore"
      - "CHANGELOG.md"
      - "docs/**"
      - "README.md"

  push: *ignore-paths

name: static analysis

permissions:
  contents: read

jobs:
  phpstan:
    uses: yii2-framework/actions/.github/workflows/phpstan.yml@1a1132f393d2572abaf9cc1fe75c5c86fce8c211 # v2.0.8
    with:
      concurrency-group: phpstan-${{ github.workflow }}-${{ github.ref }}
      ignore-platform-reqs-php-version: "[8.6]"
  phpstan-console:
    uses: yii2-framework/actions/.github/workflows/phpstan.yml@1a1132f393d2572abaf9cc1fe75c5c86fce8c211 # v2.0.8
    with:
      concurrency-group: phpstan-console-${{ github.workflow }}-${{ github.ref }}
      configuration: "phpstan-console.neon"
      ignore-platform-reqs-php-version: "[8.6]"
