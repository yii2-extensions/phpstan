---
on:
  pull_request: &ignore-paths
    paths-ignore:
      - ".gitattributes"
      - ".gitignore"
      - "CHANGELOG.md"
      - "docs/**"
      - "README.md"

  push: *ignore-paths

name: build

permissions:
  contents: read

jobs:
  phpunit:
    name: PHPUnit tests with Yii ${{ matrix.yii }}.
    strategy:
      fail-fast: false
      matrix:
        yii: ["2.0.55", "22.0.x-dev"]
        include:
          - yii: "2.0.55"
            extensions: intl, sodium
          - yii: "22.0.x-dev"
            extensions: sodium
    uses: yii2-framework/actions/.github/workflows/phpunit.yml@1a1132f393d2572abaf9cc1fe75c5c86fce8c211 # v2.0.8
    with:
      composer-command: require yiisoft/yii2:${{ matrix.yii }}
      concurrency-group: phpunit-${{ matrix.yii }}-${{ github.workflow }}-${{ github.ref }}
      extensions: ${{ matrix.extensions }}
      ignore-platform-reqs-php-version: "[8.6]"
      php-version: "[8.3, 8.4, 8.5, 8.6]"
      phpunit-path: vendor/bin/paratest
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
