---
on:
  pull_request: &ignore-paths
    paths-ignore:
      - ".gitattributes"
      - ".gitignore"
      - "CHANGELOG.md"
      - "docs/**"
      - "README.md"

  push: *ignore-paths

name: Composer require checker

permissions:
  contents: read

jobs:
  composer-require-checker:
    strategy:
      fail-fast: false
      matrix:
        yii: ["2.0.55", "22.0.x-dev"]
    uses: yii2-framework/actions/.github/workflows/composer-require-checker.yml@1a1132f393d2572abaf9cc1fe75c5c86fce8c211 # v2.0.8
    with:
      composer-command: update --with yiisoft/yii2:${{ matrix.yii }}
      concurrency-group: composer-require-checker-${{ matrix.yii }}-${{ github.workflow }}-${{ github.ref }}
      ignore-platform-reqs-php-version: "[8.6]"
