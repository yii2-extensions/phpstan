        <text class="content" x="32" y="584">YII_DEBUG and YII_ENV constants</text>
    </g>
    <g>
        <rect class="box-bg" x="16" y="616" width="588" height="84" rx="6"/>
        <rect x="16" y="616" width="4" height="84" fill="#1f883d"/>
        <text class="title" x="32" y="642">Opt-in Configuration Rules</text>
        <text class="content" x="32" y="666">Unknown options &#8226; invalid option types</text>
        <text class="content" x="32" y="684">createObject() &#8226; new &#8226; widgets &#8226; behaviors &#8226; validators &#8226; actions</text>
