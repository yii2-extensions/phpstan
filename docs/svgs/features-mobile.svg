<!-- Mobile version - Single column -->
<svg viewBox="0 0 620 820" width="100%" height="767" xmlns="http://www.w3.org/2000/svg">
    <style>
        text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        .box-bg { fill: #e6f4ea; stroke: #a7cdb3; stroke-width: 1; }
        .title { font-weight: 700; font-size: 14px; fill: #1a202c; }
        .content { font-size: 11px; fill: #4a5568; }
    </style>

    <g>
        <rect class="box-bg" x="16" y="16" width="588" height="84" rx="6"/>
        <rect x="16" y="16" width="4" height="84" fill="#1f883d"/>
        <text class="title" x="32" y="42">Active Record &amp; Active Query</text>
        <text class="content" x="32" y="66">asArray() row shapes &#8226; getAttribute() types</text>
        <text class="content" x="32" y="84">Model binding for custom query classes</text>
    </g>
    <g>
        <rect class="box-bg" x="16" y="116" width="588" height="84" rx="6"/>
        <rect x="16" y="116" width="4" height="84" fill="#1f883d"/>
        <text class="title" x="32" y="142">Application Components</text>
        <text class="content" x="32" y="166">Yii::$app typed as the configured application</text>
        <text class="content" x="32" y="184">Component classes &#8226; user identity class</text>
    </g>
    <g>
        <rect class="box-bg" x="16" y="216" width="588" height="84" rx="6"/>
        <rect x="16" y="216" width="4" height="84" fill="#1f883d"/>
        <text class="title" x="32" y="242">Application Params</text>
        <text class="content" x="32" y="266">Array shape from the configured values</text>
        <text class="content" x="32" y="284">Nested arrays &#8226; inherited module params</text>
    </g>
    <g>
        <rect class="box-bg" x="16" y="316" width="588" height="84" rx="6"/>
        <rect x="16" y="316" width="4" height="84" fill="#1f883d"/>
        <text class="title" x="32" y="342">Behaviors</text>
        <text class="content" x="32" y="366">Properties and methods of attached behaviors</text>
        <text class="content" x="32" y="384">Native members and PHPDoc</text>
    </g>
    <g>
        <rect class="box-bg" x="16" y="416" width="588" height="84" rx="6"/>
        <rect x="16" y="416" width="4" height="84" fill="#1f883d"/>
        <text class="title" x="32" y="442">Container &amp; Service Locator</text>
        <text class="content" x="32" y="466">Definitions, singletons, aliases and typed factories</text>
        <text class="content" x="32" y="484">Component IDs kept apart from container IDs</text>
    </g>
    <g>
        <rect class="box-bg" x="16" y="516" width="588" height="84" rx="6"/>
        <rect x="16" y="516" width="4" height="84" fill="#1f883d"/>
        <text class="title" x="32" y="542">Framework Integration</text>
